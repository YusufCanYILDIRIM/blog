# Yerel geliştirme servisleri.
#
# - Portlar yalnızca 127.0.0.1'e bağlanır; ağdaki diğer cihazlar erişemez.
# - Parola .env dosyasındaki POSTGRES_PASSWORD'den okunur; tanımlı değilse
#   yalnızca yerel kullanım için "postgres" kullanılır. Production veritabanı
#   bu dosyayla çalıştırılmaz.
# - Redis varsayılan olarak başlatılmaz (uygulama henüz kullanmıyor). Gerekirse:
#   docker compose --profile redis up -d
# - Volume adları önceki sürümle aynıdır; mevcut veriler korunur.

services:
  postgres:
    image: postgres:16
    container_name: blog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blogdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: blog_redis
    restart: unless-stopped
    profiles: ["redis"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

services:

  postgres:

    image: postgres:16

    container_name: blog_postgres

    restart: always

    environment:

      POSTGRES_DB: blogdb

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

  redis:

    image: redis:7

    container_name: blog_redis

    restart: always

    ports:

      - "6379:6379"

    volumes:

      - redis_data:/data

volumes:

  postgres_data:

  redis_data: